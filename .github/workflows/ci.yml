
name: Maven Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean verify
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-maven-jar
          path: target/*.jar
  download-artifact:
    name: Download JAR Artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-maven-jar
          path: downloaded-jar

      - name: Display downloaded JAR
        run: ls -lh downloaded-jar/

  deploy:
    name: Deploy JAR
    runs-on: ubuntu-latest
    needs: download-artifact

    steps:
      - name: Download JAR for deployment
        uses: actions/download-artifact@v4
        with:
          name: java-maven-jar
          path: deployment-package

      - name: Verify deployment package
        run: |
          echo "Checking deployment package..."
          ls -lh deployment-package/
          test -n "$(find deployment-package -name '*.jar')"

      - name: Simulate deployment
        run: |
          echo "Starting deployment..."
          mkdir -p deployment
          cp deployment-package/*.jar deployment/
          echo "JAR copied to deployment directory."
          ls -lh deployment/

      - name: Deployment status
        run: echo "Deployment completed successfully!"
