
name: Maven Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean verify
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-maven-jar
          path: target/*.jar
  download-artifact:
    name: Download JAR Artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: downloaded-jar

      - name: Display downloaded JAR
        run: ls -lh downloaded-jar/

